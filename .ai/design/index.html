<!--
  Open Design · OD Next handheld shell — iPhone (Dynamic Island, left silent/volume keys, right power key).
  Presentation shell for a phone-app prototype: keep the handset markup and
  CSS, put the product inside the APP CONTENT slot (`.phone-content`). The
  shell sets no typography, palette, spacing, or navigation for the app.
  Derived from the Open Design mobile-app template (Apache-2.0).
-->

/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default; never a distorted or cropped
     cover by accident. height:auto lets the ratio win over an <img height="…">
     attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
     AND add .od-media-cover together (per the core rule, only where a crop is
     deliberate — tile thumbs, decorative fills — never on full-frame content). */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
  .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

  /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */


    :root {
      --phone-screen-width: 393px;
      --phone-screen-height: 852px;
      --phone-bezel: 12px;
      --phone-outer-radius: 60px;
      --phone-screen-radius: 48px;
      --phone-safe-top: 59px;
      --phone-safe-bottom: 34px;
      --phone-system-fg: #111214;
      --phone-screen-bg: #f7f7f8;
      --phone-stage-bg: #e9ebee;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 50% 16%, rgba(255,255,255,.92), transparent 34%),
        var(--phone-stage-bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      color: #17181a;
    }

    .phone-frame {
      position: relative;
      width: calc(var(--phone-screen-width) + var(--phone-bezel) * 2);
      height: calc(var(--phone-screen-height) + var(--phone-bezel) * 2);
      padding: var(--phone-bezel);
      border-radius: var(--phone-outer-radius);
      background:
        linear-gradient(145deg, rgba(255,255,255,.18), transparent 17%),
        linear-gradient(160deg, #3a3a3d 0%, #1d1d20 47%, #09090b 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.13),
        inset 0 0 0 2px rgba(0,0,0,.9),
        0 34px 70px -20px rgba(0,0,0,.55),
        0 12px 28px -12px rgba(0,0,0,.36);
      isolation: isolate;
    }

    .phone-frame::before,
    .phone-frame::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: 102px;
      bottom: 102px;
      width: 3px;
      border-radius: 3px;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(255,255,255,.13) 12%,
        transparent 22%,
        transparent 78%,
        rgba(255,255,255,.08) 90%,
        transparent
      );
    }
    .phone-frame::before { left: -1px; }
    .phone-frame::after { right: -1px; }

    .hardware-button {
      position: absolute;
      width: 4px;
      border-radius: 3px;
      background: linear-gradient(90deg, #050506, #242428 58%, #08080a);
      box-shadow: inset 0 1px rgba(255,255,255,.08);
    }
    .hardware-button.silent { left: -3px; top: 175px; height: 34px; }
    .hardware-button.volume-up { left: -3px; top: 225px; height: 62px; }
    .hardware-button.volume-down { left: -3px; top: 299px; height: 62px; }
    .hardware-button.power { right: -3px; top: 252px; height: 104px; }

    .phone-screen {
      position: relative;
      width: var(--phone-screen-width);
      height: var(--phone-screen-height);
      overflow: hidden;
      border-radius: var(--phone-screen-radius);
      background: var(--phone-screen-bg);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
    }

    .phone-content {
      position: absolute;
      inset: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-top: var(--phone-safe-top);
      padding-bottom: var(--phone-safe-bottom);
      background: var(--phone-screen-bg);
    }
    .phone-content::-webkit-scrollbar { display: none; }

    .dynamic-island {
      position: absolute;
      z-index: 20;
      top: 11px;
      left: 50%;
      width: 126px;
      height: 37px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: #000;
      box-shadow: inset 0 -1px 1px rgba(255,255,255,.05);
      pointer-events: none;
    }

    .status-bar {
      position: absolute;
      z-index: 15;
      top: 0;
      left: 0;
      right: 0;
      height: var(--phone-safe-top);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 18px 27px 0;
      color: var(--phone-system-fg);
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -.01em;
      pointer-events: none;
    }
    .status-icons { display: inline-flex; align-items: center; gap: 6px; }
    .status-icons svg { display: block; width: 17px; height: 11px; fill: currentColor; }
    .status-icons .battery { width: 25px; }

    .home-indicator {
      position: absolute;
      z-index: 20;
      left: 50%;
      bottom: 8px;
      width: 134px;
      height: 5px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: var(--phone-system-fg);
      opacity: .9;
      pointer-events: none;
    }

    /* Sample content exists only to make the shell previewable. Replace it. */
    .sample-app { min-height: 100%; padding: 18px 20px 32px; background: #f7f7f8; }
    .sample-app h1 { margin: 0; font-size: 30px; letter-spacing: -.035em; }
    .sample-app p { margin: 8px 0 24px; color: #686b71; line-height: 1.5; }
    .sample-card {
      padding: 18px;
      border: 1px solid #e3e4e7;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(20,22,26,.06);
    }
    .sample-card + .sample-card { margin-top: 12px; }

    /* Presentation scaling: keep the whole handset visible on short viewports. */
    @media (max-height: 939px) { .phone-frame { zoom: 0.9; } }
    @media (max-height: 851px) { .phone-frame { zoom: 0.82; } }
    @media (max-height: 781px) { .phone-frame { zoom: 0.74; } }
    @media (max-height: 711px) { .phone-frame { zoom: 0.66; } }
    /* Narrow viewports: the handset chrome collapses and the screen fills the
       viewport, so the app behaves like a real phone page instead of
       scrolling sideways. */
    @media (max-width: 480px) {
      body { padding: 0; display: block; }
      .phone-frame { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; zoom: 1; }
      .phone-frame::before, .phone-frame::after, .hardware-button { display: none; }
      .phone-screen { width: 100%; height: 100%; border-radius: 0; }
    }

function icon(name){return `<svg class="ambient-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${['sun','clock'].includes(name)?'<circle cx="12" cy="12" r="'+(name==='sun'?4:9)+'"/>':''}<path d="${icons[name]||icons.monitor}"/></svg>`;}

function save(){try{localStorage.setItem(KEY,JSON.stringify(s));}catch{}applyColors();}

function phase(){if(!s.active)return s.phase==='morning'?'morning':'idle';if(Date.now()>=s.wakeAt)return 'morning';if(s.wakeAt-Date.now()<=s.preGlow*60000)return 'dawn';return 'sleeping';}

function dial(monitor=false){let h=s.active?durationText(s.wakeAt-Date.now()):durationText(s.duration*3600000);let label=s.active?'REST REMAINING':'YOUR REST TARGET';return `<div class="dial" data-od-id="circadian-dial"><svg viewBox="0 0 300 300" aria-label="24-hour dial, night sleep followed by sunrise"><g fill="none" stroke-width="2"><circle class="track" cx="150" cy="150" r="126"/>${Array.from({length:48},(_,i)=>`<path d="M150 17v${i%2?3:7}" transform="rotate(${i*7.5} 150 150)" stroke="var(--muted)" opacity="${i%2?.3:.6}"/>`).join('')}</g><circle cx="150" cy="150" r="112" fill="none" class="track" stroke-width="8"/><circle cx="150" cy="150" r="112" fill="none" class="sleep-arc" stroke-width="8" stroke-linecap="round" stroke-dasharray="225 704" transform="rotate(-105 150 150)"/><circle cx="150" cy="150" r="112" fill="none" class="dawn-arc" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 704" transform="rotate(9 150 150)"/><circle cx="121" cy="42" r="5" fill="var(--fg)"/><circle cx="258" cy="179" r="5" fill="var(--dawn)"/><text class="dial-label" x="150" y="12" text-anchor="middle">00</text><text class="dial-label" x="288" y="154" text-anchor="middle">06</text><text class="dial-label" x="150" y="296" text-anchor="middle">12</text><text class="dial-label" x="12" y="154" text-anchor="middle">18</text></svg><div class="dial-copy"><span class="eyebrow">${label}</span><span class="hours num od-nowrap" data-countdown>${h}</span><span class="phase">${s.active?'Rest easy. We’ll keep time.':'A quieter end to your day.'}</span></div></div>`;}
function times(){return `<div class="sleep-times"><div class="od-stat"><small>BEDTIME</small><strong class="num od-nowrap">${time(startTime())}</strong></div><div class="od-stat"><small>WAKE UP</small><strong class="num od-nowrap">${time(endTime())}</strong></div></div>`;}
function connection(){return `<button class="connection" data-action="connection">${icon('monitor')}<span class="od-field od-fill"><strong>Karan’s MacBook Air</strong><small>Local Wi-Fi · 4 displays</small></span><span class="dot"></span>${icon('arrow')}</button>`;}

function rest(){return `${connection()}<div class="row-between"><span class="eyebrow" data-status>${stateTitle()}</span><span class="badge">${icon('bell')} ${platform==='android'?'RTC':'Alarm'} · ${s.active?'Armed':'Ready'}</span></div>${dial()}${times()}<div class="sunrise-row">${icon('sun')}<span>Sunrise glow <strong class="od-nowrap">${time(endTime()-s.preGlow*60000)}</strong> · ${s.preGlow} min</span></div><div class="od-stack">${btn(s.active?'I’m awake':'Start sleep',s.active?'wake':'start','btn-primary wide',s.phase==='syncing'?'disabled':'')}${s.active?'<a class="btn btn-ghost wide" href="#lock">'+icon('lock')+'Lock screen</a>':''}</div><div><div class="section-title"><h2>Make room for rest</h2><span class="meta">${s.duration}h target</span></div><div class="chips">${btn('+15m','extend','','data-minutes="15"')}${btn('+30m','extend','','data-minutes="30"')}${btn('Power nap · 20m','nap')}${btn('Deep rest · 7.5h','deep')}</div></div><div class="chips">${[6,7,7.5,8,9].map(d=>`<button class="chip" data-duration="${d}" aria-pressed="${s.duration===d}">${d}h</button>`).join('')}</div>${switcher('Away mode','away','Keep your monitors dark when you’re away.')}<p class="note">${platform==='android'?'Hardware RTC and device presence are simulated in this prototype.':'Alarm and Live Activity states are simulated. Android hardware RTC is not available on iOS.'}</p>`;}

ay-list">${stations[0].displays.map(d=>`<label class="target-row"><input type="checkbox" data-display="${d.id}" ${s.displays.includes(d.id)?'checked':''}><span class="od-field"><span>${d.name}</span><small>${d.res}</small></span></label>`).join('')}</div></details><div class="card">${switcher('Unlock via phone only','draft-policy','When on, the Mac ESC key cannot dismiss.',draft.policy==='phone_only')}<div class="field"><label for="canvas-duration">Display duration</label><select id="canvas-duration">${[[0,'Until cleared'],[15,'15 seconds'],[30,'30 seconds']].map(([n,l])=>`<option value="${n}" ${draft.seconds===n?'selected':''}>${l}</option>`).join('')}</select></div></div><span class="error" id="dispatch-error" aria-live="polite"></span><button type="submit" class="btn btn-primary wide">Send to displays ${icon('arrow')}</button>${btn('Quick clear','clear','btn-ghost wide')}</form>`;}

function annotate(node=document){node.querySelectorAll('h1,h2,h3,button,input,select,a,article,section,details').forEach((el,i)=>{if(!el.dataset.odId)el.dataset.odId=(el.id||el.dataset.action||el.dataset.toggle||el.tagName.toLowerCase())+'-'+i;});}
function navigateMobile(route,writeHistory=true){
  if(kind!=='mobile'||!['rest','canvas','fleet','settings','lock','alarm','glance'].includes(route))return;
  const sc=document.querySelector('.mobile-page')||root;
  if(sc&&current)scrolls[current]=sc.scrollTop;
  closeDialog();mobileRoute=route;
  if(writeHistory&&location.hash!=='#'+route){try{history.pushState(null,'','#'+route);}catch{ /* Embedded hosts may restrict history. */ }}

}

function updatePreview(){const h=document.getElementById('preview-headline'),sub=document.getElementById('preview-subtitle'),count=document.getElementById('character-count'),p=document.getElementById('media-preview');if(h)h.textContent=draft.headline;if(sub)sub.textContent=draft.subtitle;if(count)count.textContent=draft.headline.length+'/100 characters';if(p){p.innerHTML='';if(draft.mode==='photo'&&mediaURL){const img=new Image();img.src=mediaURL;img.alt='Selected photo poster';img.onload=()=>{img.width=img.naturalWidth;img.height=img.naturalHeight;};p.append(img);}else if(draft.mode==='video'&&mediaURL){const v=document.createElement('video');v.src=mediaURL;v.controls=true;v.loop=true;v.muted=true;v.playsInline=true;p.append(v);}else if(draft.mode==='web'){p.innerHTML=`<div class="card"><span class="badge">Web dashboard</span><p>${esc(draft.url||'Enter your dashboard URL')}</p><small>Simulated preview</small></div>`;}else if(draft.mode!=='text'){p.innerHTML=`<p class="note">${draft.mode==='video'?'Choose a video to hear the room settle.':'Choose a photo to make this canvas yours.'}</p>`;}}}
async function db(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error('Unavailable'));const r=indexedDB.open('ambient-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function storeMedia(blob,key){const d=await db();return new Promise((resolve,reject)=>{const t=d.transaction('files','readwrite');t.objectStore('files').put(blob,key);t.oncomplete=()=>{d.close();resolve();};t.onerror=()=>{d.close();reject(t.error);};});}
async function readMedia(key){const d=await db();return new Promise((resolve,reject)=>{const r=d.transaction('files').objectStore('files').get(key);r.onsuccess=()=>{d.close();resolve(r.result);};r.onerror=()=>{d.close();reject(r.error);};});}

async function dispatch(form){if(!validateCanvas())return;const submit=form.querySelector('[type=submit]');submit.disabled=true;submit.textContent='Sending…';try{if(mediaBlob&&['photo','video'].includes(draft.mode)){draft.mediaKey='media-'+Date.now();await storeMedia(mediaBlob,draft.mediaKey);}else if(['photo','video'].includes(draft.mode)&&!draft.mediaKey)throw Error('media');s.canvas={...draft,targets:[...s.selected],displayTargets:[...s.displays],active:true,expires:draft.seconds?Date.now()+draft.seconds*1000:0};save();draft={...s.canvas};setTimeout(()=>{render();toast('Canvas sent to '+s.canvas.displayTargets.length+' displays.');},500);}catch{submit.disabled=false;submit.innerHTML='Send to displays '+icon('arrow');document.getElementById('dispatch-error').textContent='Media could not be saved. Try a smaller local file or use Billboard Text.';}}
function validateCanvas(){let ok=true;const err=(id,msg)=>{const el=document.getElementById(id+'-error');if(el)el.textContent=msg;if(msg)ok=false;};err('headline',draft.headline.trim()?'':'Add a headline before sending.');if(draft.mode==='web'){let valid=false;try{valid=new URL(draft.url).protocol==='https:';}catch{}err('weburl',valid?'':'Use a complete HTTPS URL, such as https://example.com.');}if(['photo','video'].includes(draft.mode))err('media-file',mediaBlob||draft.mediaKey?'':'Choose a local '+draft.mode+' file first.');const e=document.getElementById('dispatch-error');if(e)e.textContent=!s.selected.length||!s.displays.length?'Choose an online workstation and at least one display.':'';return ok&&s.selected.length>0&&s.displays.length>0;}
function action(a,el){switch(a){case'start':if(s.confirmSleep){modal('Start your rest?',`<p>Your wake target will be ${time(Date.now()+s.duration*3600000)}. ${s.away?'Your monitors will stay dark.':''}</p>`,btn('Start sleep','start-confirm','btn-primary')+btn('Cancel','close-dialog'));}else beginSleep();break;case'start-confirm':closeDialog();beginSleep();break;case'wake':stopSleep();break;case'nap':beginSleep(20);break;case'deep':s.duration=7.5;save();render();toast('Deep rest set to 7.5 hours.');break;case'extend':{let m=Number(el.dataset.minutes);if(s.active)s.wakeAt+=m*60000;else s.duration=Math.min(16,s.duration+m/60);save();render();toast('Rest extended by '+m+' minutes.');break;}case'connection':modal('Your workstation',`<div class="od-stack"><p>Karan’s MacBook Air</p><span class="badge"><span class="dot"></span>Local Wi-Fi · simulated</span><p class="note">192.168.1.2 · Port 8321<br>Bonjour / mDNS · 4 displays<br>Cloud ${s.signedIn?'connected':'not connected'}</p></div>`,btn('Force sync','sync')+btn('Done','close-dialog','btn-primary'));break;case'clear':s.canvas.active=false;s.canvas.targets=[];save();render();toast('Canvas cleared.');break;case'clear-device':s.canvas.targets=s.canvas.targets.filter(x=>x!==el.dataset.device);if(!s.canvas.targets.length)s.canvas.active=false;save();render();toast('Workstation canvas cleared.');break;case'clear-all':modal('Clear all displays?',`<p>This clears every canvas and ends the current sleep display session.</p>`,btn('Clear all displays','clear-confirm','btn-danger')+btn('Keep displays','close-dialog'));break;case'clear-confirm':s.canvas.active=false;s.canvas.targets=[];s.active=false;s.phase='idle';save();closeDialog();render();toast('All displays cleared.');break;case'test':quickTest();break;case'end-test':s.testUntil=0;save();clearTimeout(testTimer);closeDialog();toast('Ambient test ended.');break;case'sync':case'discover':case'ping':{const texts={sync:['Syncing preferences…','Preferences synchronized.'],discover:[' function validateSetting(el){let valid=el.checkValidity();const msg=!valid?(el.type==='number'?`Enter a value from ${el.min} to ${el.max}${el.step!=='any'?' in steps of '+el.step:''}.`:'Choose a valid local time.'):'';const err=document.getElementById(el.id+'-error');if(err)err.textContent=msg;el.setAttribute('aria-invalid',String(!valid));return valid;}
document.addEventListener('focusout',e=>{const el=e.target;if(el.dataset.setting)validateSetting(el);if(el.dataset.hex){const valid=/^#[0-9a-f]{6}$/i.test(el.value);document.getElementById(el.id+'-error').textContent=valid?'':'Use a six-digit hex color, such as #38BDF8.';el.setAttribute('aria-invalid',String(!valid));if(valid){s[el.dataset.hex]=el.value;save();const c=document.querySelector('[data-color="'+el.dataset.hex+'"]');if(c)c.value=el.value;}}if(el.id==='headline'){document.getElementById('headline-error').textContent=el.value.trim()?'':'Add a headline before sending.';}if(el.id==='weburl'){let v=false;try{v=new URL(el.value).protocol==='https:';}catch{}document.getElementById('weburl-error').textContent=v?'':'Use a complete HTTPS URL.';}});
document.addEventListener('submit',e=>{if(e.target.id==='canvas-form'){e.preventDefault();dispatch(e.target);}});
document.addEventListener('keydown',e=>{const d=document.querySelector('.dialog');if(d){if(e.key==='Escape'){closeDialog();return;}if(e.key==='Tab'){const items=[...d.querySelectorAll('button,a,input,select,[tabindex="0"]')].filter(x=>!x.disabled);const first=items[0],last=items.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===d)){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}}else if(e.key==='Escape'&&kind==='monitor'){if((s.canvas.active?s.canvas.policy:defaults.canvas.policy)==='phone_only'&&(location.hash==='#billboard'||s.canvas.active))toast('Phone-only lock. Clear this canvas from your companion.');else action('dismiss-monitor',document.body);}else if(e.key==='Escape'&&kind==='mac'){document.getElementById('menu-slot').innerHTML='';}});
function restoreRoute(){if(kind==='mobile')navigateMobile((location.hash||'#rest').slice(1),false);else{closeDialog();render();}}
window.addEventListener('hashchange',restoreRoute);window.addEventListener('popstate',restoreRoute);root?.addEventListener('scroll',e=>{if(current&&(e.target===root||e.target.matches?.('.mobile-page')))scrolls[current]=e.target.scrollTop;},{passive:true,capture:true});
window.addEventListener('storage',e=>{if(e.key===KEY){s=load();if(current!=='canvas')draft={...s.canvas};render();}});
document.addEventListener('visibilitychange',()=>{if(kind!=='mobile')return;if(document.hidden){lastHidden=Date.now();if(s.auto&&!s.active&&inWindow(s.sleepFrom,s.sleepTo))beginSleep(null,true);}else if(lastHidden&&s.active){const elapsed=Date.now()-lastHidden;if(elapsed>180000&&inWindow(s.sleepFrom,s.sleepTo))glance();else if(inWindow(s.pushFrom,s.pushTo)&&s.auto&&elapsed>60000){s.start=Date.now();s.wakeAt=s.start+s.duration*3600000;save();render();}lastHidden=0;}});
setInterval(()=>{if(s.testUntil&&Date.now()>=s.testUntil){s.testUntil=0;save();render();}document.querySelectorAll('[data-clock]').forEach(x=>x.textContent=time(Date.now()).replace(/ AM| PM/g,''));document.querySelectorAll('[data-countdown]').forEach(x=>{if(s.active)x.textContent=durationText(s.wakeAt-Date.now());});const tc=document.getElementById('test-countdown');if(tc)tc.textContent=Math.max(0,Math.ceil((s.testUntil-Date.now())/1000))+' seconds';if(s.canvas.active&&s.canvas.expires&&Date.now()>=s.canvas.expires){s.canvas.active=false;save();render();toast('Timed canvas finished.');}const expiry=document.getElementById('expiry-label');if(expiry&&s.canvas.active&&s.canvas.expires)expiry.textContent='Closes in '+Math.max(0,Math.ceil((s.canvas.expires-Date.now())/1000))+'s';if(s.active&&s.phase!=='syncing'){let p=phase();if(p!==s.phase){s.phase=p;save();if(p==='morning'&&kind==='mobile')navigateMobile('alarm');else render();}}},1000);
applyColors();render();
})();
</script>
</body>
